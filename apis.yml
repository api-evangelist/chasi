aid: chasi
name: Chasi
description: >-
  Chasi (Chasi AI) is a Y Combinator Winter 2026 company building an AI revenue
  engine for the equipment industry — sales, rental, and service. Chasi deploys
  AI agents that plug into an equipment dealer or rental company's existing
  stack and work around the clock to handle lead intake, quoting, CRM updates,
  follow-ups, and booking coordination, so teams respond faster, sell more, and
  maximize fleet utilization without adding headcount. Founded in 2025 by Akash
  Pavan and Sarman Aulakh, the company targets an industry where fleet
  utilization often sits below 60% and reps lose hours each day to email,
  voicemail, and manual data entry. At the time of profiling Chasi is
  pre-product-public: it exposes a marketing site, a trust center, and a demo
  booking flow, but publishes no public developer API, OpenAPI, or SDKs yet.
