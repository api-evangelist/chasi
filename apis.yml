    Chasi-AI GitHub org has 0 public repos, and the only docs-shaped subdomain,
    docs.chasi.ai, is mispointed at Cap's (cap.so) documentation — its OpenAPI
    self-identifies as "Cap HTTP API", so it was rejected under the ownership
    check and nothing was derived from it.
