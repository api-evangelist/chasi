# ---------------------------------------------------------------------------
# CONTRACT DISCOVERY — recorded here because it is a probe result, and because
# the most important thing found on a Chasi host does not belong to Chasi.
# ---------------------------------------------------------------------------
contract_discovery:
  verdict: no-published-contract
  checked: '2026-08-13'
  rest_openapi:
    found: false
    note: >-
      /openapi.json, /openapi.yaml, /swagger.json, /api-docs and /api were
      probed on chasi.ai, chasi.co, app.chasi.ai and demo.chasi.co.
      api.chasi.ai and api.chasi.co do not resolve (NXDOMAIN); chasi.ai has no
      wildcard DNS, so a missing subdomain is a real absence.
  graphql:
    found: false
    note: No /graphql surface on any Chasi host.
  mcp:
    found: false
    note: >-
      POST tools/list to https://chasi.ai/mcp returned 404; app.chasi.ai/mcp and
      demo.chasi.co/mcp returned the SPA shell. mcp.chasi.ai does not resolve.
  agent_card:
    found: false
    note: >-
      /.well-known/agent-card.json and /.well-known/agent.json 404 on chasi.ai
      and chasi.co, and return the SPA shell on app.chasi.ai and demo.chasi.co.
      Nothing written to a2a/.
  rejected_contracts:
  - url: https://docs.chasi.ai/api
    http_status: 200
    parses_as: OpenAPI 3.1.0
    rejected: true
    reason: >-
      OWNERSHIP FAILURE (pipeline STEP 0c). docs.chasi.ai resolves through
      Cloudflare to a deployment that serves the documentation of Cap
      (cap.so) — an unrelated open-source screen-recording company — not
      Chasi's. The spec at this URL self-identifies as info.title "Cap HTTP
      API", version 0.0.1, description "Internal API used by Cap Desktop and
      external services", with Chrome-extension auth operations
      (extension.startAuth, extension.approveAuth). The host's sitemap
      (https://docs.chasi.ai/sitemap.xml, 200) lists only cap.so URLs and its
      robots.txt declares "Sitemap: https://cap.so/sitemap.xml". This is a
      mispointed / dangling subdomain on chasi.ai, not a Chasi API. NOT SAVED,
      and nothing was derived from it.
  - url: https://docs.chasi.ai/llms.txt
    http_status: 200
    rejected: true
    reason: >-
      Same mispointed host. The document opens "# Cap: Screen Recording,
      Sharing, and Video Collaboration" and describes Cap Desktop. Not Chasi's
      llms.txt. NOT SAVED.
  - url: https://docs.chasi.ai/llms-full.txt
    http_status: 200
    rejected: true
    reason: Same mispointed host; Cap's full reference. NOT SAVED.
  provider_action: >-
    docs.chasi.ai currently serves another company's product documentation to
    anyone who visits it. This is a DNS/hosting misconfiguration on Chasi's own
    domain and is worth flagging to Chasi independently of anything in this
    catalog.
